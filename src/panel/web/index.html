<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>MCPHelm 控制台</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="30" height="30" />
        <div>
          <h1 id="brandName">MCPHelm</h1>
          <p class="sub" id="configPath">正在加载配置信息 …</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="chip" id="runtimeChip">运行时检查中 …</span>
        <button class="btn" id="btnDoctor" type="button">环境体检</button>
        <button class="btn" id="btnRefresh" type="button">刷新</button>
      </div>
    </header>

    <main>
      <section class="panel" id="doctorCard" hidden>
        <div class="panel-head">
          <h2>环境体检</h2>
          <div class="panel-tools">
            <label class="hint"><input type="checkbox" id="doctorOnline" /> 顺带联网查最新版</label>
            <button class="btn ghost" id="btnDoctorClose" type="button">收起</button>
          </div>
        </div>
        <div class="checks" id="doctorBody"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>隧道</h2>
          <span class="hint" id="tunnelHint"></span>
        </div>
        <div class="grid" id="tunnels"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>本地 MCP 服务器</h2>
          <span class="hint">用命令行 <code>mcphelm server add</code> 注册后这里会自动出现</span>
        </div>
        <div class="grid" id="servers"></div>
      </section>
    </main>

    <aside class="drawer" id="drawer" hidden>
      <div class="panel-head">
        <h2>日志 · <span id="logName">-</span></h2>
        <div class="panel-tools">
          <label class="hint"><input type="checkbox" id="logAuto" checked /> 自动刷新</label>
          <button class="btn ghost" id="btnLogClose" type="button">关闭</button>
        </div>
      </div>
      <pre class="log" id="logBody"></pre>
    </aside>

    <div class="toasts" id="toasts"></div>
    <footer class="footer" id="footer">本地控制台 · 数据全部来自本机</footer>
    <script src="/app.js"></script>
  </body>
</html>
